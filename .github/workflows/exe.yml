name: windows-exe

# Builds the single executable that Windows users download. Run it by hand, then
# download the artifacts and attach exactly those bytes to the release:
#
#   gh workflow run exe.yml
#   gh run download <id> -D <dir>
#   gh release upload v0.2.0 <dir>/windows-exe/*.zip
#
# It deliberately does not run on a tag. A ZIP's sha256 depends on file
# timestamps, so a rebuild produces different bytes, and the winget/Scoop
# manifests pin the hash of the published file. Publishing the artifact that was
# actually tested is the point.
#
# The build has to run on Windows: a single executable is a copy of node.exe with
# a blob injected, so the runtime and the blob must come from the same platform.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 is the oldest LTS that supports single executable applications
          # without extra flags, and an executable built on 22 runs everywhere.
          node-version: 22

      - run: npm ci

      - name: Build the executable and the ZIPs
        run: npm run build:exe

      - name: Verify the executable
        run: |
          .\build\halfsize.exe --version
          .\build\halfsize\halfsize.exe --doctor

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            build/*.zip
            build/artifact.json
          if-no-files-found: error